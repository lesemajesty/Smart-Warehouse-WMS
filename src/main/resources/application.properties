spring.application.name=smart-warehouse
server.port=8080

# 本机 MySQL 8.0（持久化，重启不丢数据）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smart_warehouse?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# JPA：由实体自动维护表结构（首次启动建表，后续加字段自动更新）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# SQL 日志只在 dev profile 打开（见 application-dev.properties），默认不刷屏

# Thymeleaf 开发期关闭缓存
spring.thymeleaf.cache=false
